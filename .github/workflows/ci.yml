name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # `npm test` compares against tests/golden*.json — no PHP, no Laravel app.
    # The oracles (npm run oracle:*) need PHP and a composer install and are
    # run separately; see README "Fidelity".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
